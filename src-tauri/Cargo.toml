[package]
name = "kuantra-terminal"
version = "0.1.0"
description = "Kuantra Terminal - Institutional Quant Trading Terminal"
authors = ["Kuantra Team <dev@kuantra.internal>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-stronghold = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"