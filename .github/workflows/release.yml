name: Kuantra Terminal Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact release tag validated by the truth matrix"
        required: true
        default: "v1.0.0"
        type: string
      publish:
        description: "Publish a GitHub Release after all final-artifact gates pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  # Manual runs are release candidates by default. The truth checker still
  # rejects any tag that is not the currently accepted product tag.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: bash scripts/package_macos.sh
    steps:
      - uses: actions/checkout@v7
      - name: Initialize isolated data directory
        shell: bash
        run: printf '%s\n' 'KUANTRA_DATA_DIR=${{ runner.temp }}/kuantra-data' >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Verify release truth contract
        shell: bash
        run: python scripts/check_release_truth.py --tag "${RELEASE_TAG}"
      - name: Run full backend test suite
        run: python -m pytest backend/tests -q --tb=short
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=moderate
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build desktop app
        run: python scripts/build_desktop.py --skip-frontend
      - name: Smoke test desktop app
        shell: bash
        run: |
          python scripts/smoke_desktop.py
      - name: Package
        shell: bash
        run: ${{ matrix.package }}
      - name: Smoke test final packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          dmg="dist/Kuantra-Terminal-${VERSION}-aarch64.dmg"
          [ -f "$dmg" ] || { echo "expected arm64 DMG missing: $dmg" >&2; exit 1; }
          python scripts/smoke_macos_dmg.py --dmg "$dmg" --data-dir "$RUNNER_TEMP/kuantra-final-smoke-data" --report dist/final-smoke-macos.json
          python scripts/run_n05_macos_distribution_preflight.py --dmg "$dmg" --smoke-report dist/final-smoke-macos.json --output dist/n05-macos-distribution.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/Kuantra-Terminal-*.dmg
            dist/final-smoke-macos.json
            dist/n05-macos-distribution.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify release truth contract
        run: python scripts/check_release_truth.py --tag "${RELEASE_TAG}"
      - name: Render current release notes
        run: python scripts/render_current_release_notes.py --output dist/CURRENT_RELEASE_NOTES.md
      - name: Audit Phase 0 exit evidence
        run: |
          set -euo pipefail
          python scripts/audit_phase0_exit.py \
            --smoke-report dist/final-smoke-macos.json \
            --n05-macos-report dist/n05-macos-distribution.json \
            --json | tee dist/PHASE0_EXIT_AUDIT.json
      - name: Build MANIFEST.json
        run: python scripts/generate_release_manifest.py --dist dist --tag "${RELEASE_TAG}" --macos-distribution-report dist/n05-macos-distribution.json
      - uses: actions/upload-artifact@v7
        with:
          name: phase0-exit-evidence
          path: |
            dist/PHASE0_EXIT_AUDIT.json
            dist/final-smoke-*.json
            dist/MANIFEST.json
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || inputs.publish == true
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kuantra Terminal ${{ env.RELEASE_TAG }}
          body_path: dist/CURRENT_RELEASE_NOTES.md
          files: |
            dist/Kuantra-Terminal-*
            dist/MANIFEST.json
