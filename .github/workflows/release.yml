name: Kuantra Terminal Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact release tag validated by the truth matrix"
        required: true
        default: "v1.4.0"
        type: string
      publish:
        description: "Publish a GitHub Release after all final-artifact gates pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  # Manual runs are release candidates by default. The truth checker still
  # rejects any tag that is not the currently accepted product tag.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: bash scripts/package_windows.sh
          - os: macos-latest
            package: bash scripts/package_macos.sh
          - os: ubuntu-22.04
            package: bash scripts/package_linux.sh
    steps:
      - uses: actions/checkout@v7
      - name: Initialize isolated data directory
        shell: bash
        run: printf '%s\n' 'KUANTRA_DATA_DIR=${{ runner.temp }}/kuantra-data' >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils xvfb libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libnss3 libasound2 libgl1 libegl1 \
            libxdamage1 libxcomposite1 libxrandr2 libxtst6 libdbus-1-3
      - name: Install NSIS (windows-2025 images ship without it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Verify release truth contract
        shell: bash
        run: python scripts/check_release_truth.py --tag "${RELEASE_TAG}"
      - name: Run full backend test suite
        run: python -m pytest backend/tests -q --tb=short
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=moderate
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build desktop app
        run: python scripts/build_desktop.py --skip-frontend
      - name: Smoke test desktop app
        shell: bash
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python scripts/smoke_desktop.py; else python scripts/smoke_desktop.py; fi
      - name: Package
        shell: bash
        run: ${{ matrix.package }}
      - name: Smoke test final packaged artifact
        shell: bash
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          case "$RUNNER_OS" in
            Windows)
              installer="dist/Kuantra-Terminal-${VERSION}-Setup.exe"
              install_dir="$RUNNER_TEMP/kuantra-installed"
              rm -rf "$install_dir"
              # NSIS /D must be the final command-line argument.
              export K_INSTALLER_PS="$(cygpath -w "$installer")"
              export K_INSTALL_DIR_PS="$(cygpath -w "$install_dir")"
              powershell.exe -NoProfile -NonInteractive -Command '$p = Start-Process -FilePath $env:K_INSTALLER_PS -ArgumentList @("/S", "/D=$env:K_INSTALL_DIR_PS") -Wait -PassThru; if ($p.ExitCode -ne 0) { exit $p.ExitCode }'
              exe="$install_dir/Kuantra Terminal.exe"
              python scripts/smoke_desktop.py --executable "$exe" --artifact "$installer" --data-dir "$RUNNER_TEMP/kuantra-final-smoke-data" --report dist/final-smoke-windows.json
              python scripts/check_provenance.py --report dist/final-smoke-windows.json --release
              ;;
            macOS)
              dmg="dist/Kuantra-Terminal-${VERSION}-aarch64.dmg"
              if [ ! -f "$dmg" ]; then dmg="dist/Kuantra-Terminal-${VERSION}-x64.dmg"; fi
              [ -f "$dmg" ] || { echo "expected DMG missing: $dmg" >&2; exit 1; }
              python scripts/smoke_macos_dmg.py --dmg "$dmg" --data-dir "$RUNNER_TEMP/kuantra-final-smoke-data" --report dist/final-smoke-macos.json
              python scripts/run_n05_macos_distribution_preflight.py --dmg "$dmg" --smoke-report dist/final-smoke-macos.json --output dist/n05-macos-distribution.json
              ;;
            Linux)
              appimage="dist/Kuantra-Terminal-${VERSION}-x86_64.AppImage"
              xvfb-run -a python scripts/smoke_desktop.py --executable "$appimage" --artifact "$appimage" --appimage --data-dir "$RUNNER_TEMP/kuantra-final-smoke-data" --report dist/final-smoke-linux.json
              python scripts/check_provenance.py --report dist/final-smoke-linux.json --release
              ;;
            *)
              echo "unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/Kuantra-Terminal-*
            dist/final-smoke-*.json
            dist/n05-macos-distribution.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify release truth contract
        run: python scripts/check_release_truth.py --tag "${RELEASE_TAG}"
      - name: Render current release notes
        run: python scripts/render_current_release_notes.py --output dist/CURRENT_RELEASE_NOTES.md
      - name: Audit Phase 0 exit evidence
        run: |
          set -euo pipefail
          python scripts/audit_phase0_exit.py \
            --smoke-report dist/final-smoke-windows.json \
            --smoke-report dist/final-smoke-macos.json \
            --smoke-report dist/final-smoke-linux.json \
            --json | tee dist/PHASE0_EXIT_AUDIT.json
      - name: Build MANIFEST.json
        run: python scripts/generate_release_manifest.py --dist dist --tag "${RELEASE_TAG}"
      - uses: actions/upload-artifact@v7
        with:
          name: phase0-exit-evidence
          path: |
            dist/PHASE0_EXIT_AUDIT.json
            dist/final-smoke-*.json
            dist/MANIFEST.json
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || inputs.publish == true
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kuantra Terminal ${{ env.RELEASE_TAG }}
          body_path: dist/CURRENT_RELEASE_NOTES.md
          files: |
            dist/Kuantra-Terminal-*
            dist/MANIFEST.json
