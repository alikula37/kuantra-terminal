name: Kuantra Terminal Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact release tag validated by the truth matrix"
        required: true
        default: "v1.1.5"
        type: string
      publish:
        description: "Publish a GitHub Release after all final-artifact gates pass"
        required: true
        default: false
        type: boolean

permissions:
  # Build jobs only need to read the checkout.  The publish job below narrows
  # write access to the release step explicitly.
  contents: read

env:
  # Manual runs are release candidates by default. The truth checker still
  # rejects any tag that is not the currently accepted product tag.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Package (${{ matrix.os }} / ${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            architecture: arm64
            package: bash scripts/package_macos.sh
          - os: macos-15-intel
            architecture: x86_64
            package: bash scripts/package_macos.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize isolated data directory
        shell: bash
        run: printf '%s\n' 'KUANTRA_DATA_DIR=${{ runner.temp }}/kuantra-data' >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
      - name: Prepare Intel cryptography build
        if: matrix.architecture == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          command -v rustc >/dev/null 2>&1 || brew install rust
          command -v cargo >/dev/null 2>&1
          openssl_dir="$(brew --prefix openssl@3)"
          test -f "$openssl_dir/lib/libssl.a"
          test -f "$openssl_dir/lib/libcrypto.a"
          echo "OPENSSL_DIR=$openssl_dir" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          uv cache clean cryptography
          python -m pip cache remove cryptography || true
      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          expected="${{ matrix.architecture }}"
          [ "$actual" = "$expected" ] || {
            echo "native runner architecture mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          python scripts/macos_architecture.py --expected-architecture "$expected"
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Verify release truth contract
        shell: bash
        run: python scripts/check_release_truth.py --tag "${RELEASE_TAG}"
      - name: Run full backend test suite
        run: python -m pytest backend/tests -q --tb=short
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Audit frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "false" ]; then
            # Any manual candidate run (a trusted-pilot candidate that does not
            # publish a GitHub Release) does not ship node_modules. Keep the
            # runtime dependency gate strict, while recording the known
            # development toolchain findings that the owner intentionally
            # deferred. Published releases stay strict.
            npm --prefix frontend audit --omit=dev --audit-level=moderate
            if ! npm --prefix frontend audit --audit-level=moderate; then
              echo "::warning::Known development-only npm audit findings are retained for the trusted pilot; production publish remains blocked until remediated or explicitly accepted."
            fi
          else
            npm --prefix frontend audit --audit-level=moderate
          fi
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build desktop app
        run: python scripts/build_desktop.py --skip-frontend --expected-architecture "${{ matrix.architecture }}"
      - name: Smoke test desktop app
        shell: bash
        env:
          KUANTRA_SMOKE_LOCAL_TRACKING: "1"
          KUANTRA_MARKET_DATA_ENABLED: "false"
          KUANTRA_GATEWAY_ENABLED: "0"
        run: |
          python scripts/smoke_desktop.py --expected-architecture "${{ matrix.architecture }}"
      - name: Package
        shell: bash
        run: ${{ matrix.package }} --architecture "${{ matrix.architecture }}"
      - name: Smoke test final packaged artifact
        shell: bash
        env:
          KUANTRA_SMOKE_LOCAL_TRACKING: "1"
          KUANTRA_MARKET_DATA_ENABLED: "false"
          KUANTRA_GATEWAY_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          arch="${{ matrix.architecture }}"
          dmg="dist/Kuantra-Terminal-${VERSION}-${arch}.dmg"
          smoke_report="dist/final-smoke-${arch}.json"
          n05_report="dist/n05-macos-distribution-${arch}.json"
          [ -f "$dmg" ] || { echo "expected $arch DMG missing: $dmg" >&2; exit 1; }
          python scripts/smoke_macos_dmg.py \
            --dmg "$dmg" \
            --expected-architecture "$arch" \
            --data-dir "$RUNNER_TEMP/kuantra-final-smoke-data-$arch" \
            --report "$smoke_report"
          set +e
          python scripts/run_n05_macos_distribution_preflight.py \
            --dmg "$dmg" \
            --smoke-report "$smoke_report" \
            --output "$n05_report"
          n05_status=$?
          set -e
          if [ "$n05_status" -eq 2 ] && [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "false" ]; then
            echo "ad-hoc candidate: retaining blocked N05 evidence without publishing"
            exit 0
          fi
          exit "$n05_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos-${{ matrix.architecture }}
          path: |
            dist/Kuantra-Terminal-*.dmg
            dist/final-smoke-${{ matrix.architecture }}.json
            dist/n05-macos-distribution-${{ matrix.architecture }}.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Validate release tag input
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9._-]{1,40}$ ]]; then
            echo "invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify release truth contract
        run: python scripts/check_release_truth.py --tag "${RELEASE_TAG}"
      - name: Render current release notes
        run: python scripts/render_current_release_notes.py --output dist/CURRENT_RELEASE_NOTES.md
      - name: Audit Phase 0 exit evidence
        run: |
          set -euo pipefail
          python scripts/audit_phase0_exit.py \
            --smoke-report dist/final-smoke-arm64.json \
            --smoke-report dist/final-smoke-x86_64.json \
            --n05-macos-report dist/n05-macos-distribution-arm64.json \
            --n05-macos-report dist/n05-macos-distribution-x86_64.json \
            --json | tee dist/PHASE0_EXIT_AUDIT.json
      - name: Build MANIFEST.json
        run: |
          python scripts/generate_release_manifest.py \
            --dist dist \
            --tag "${RELEASE_TAG}" \
            --macos-distribution-report dist/n05-macos-distribution-arm64.json \
            --macos-distribution-report dist/n05-macos-distribution-x86_64.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase0-exit-evidence
          path: |
            dist/PHASE0_EXIT_AUDIT.json
            dist/final-smoke-*.json
            dist/MANIFEST.json
          if-no-files-found: error
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: github.event_name == 'push' || inputs.publish == true
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kuantra Terminal ${{ env.RELEASE_TAG }}
          body_path: dist/CURRENT_RELEASE_NOTES.md
          files: |
            dist/Kuantra-Terminal-*
            dist/MANIFEST.json

  prepare-pilot-package:
    name: Prepare Trusted Pilot Package
    needs: build-and-package
    # A manual candidate run can produce a downloadable CI artifact without
    # creating a GitHub Release or a tag.  Published releases still require the
    # stricter N05 path above.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: release-macos-*
          merge-multiple: true
      - name: Build exact trusted pilot package
        run: |
          set -euo pipefail
          python scripts/prepare_pilot_package.py \
            --dist dist \
            --output "dist/pilot-package-${RELEASE_TAG}"
      - name: Verify pilot package checksums
        run: |
          set -euo pipefail
          (
            cd "dist/pilot-package-${RELEASE_TAG}"
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trusted-macos-pilot-package
          path: dist/pilot-package-${{ inputs.release_tag }}
          if-no-files-found: error
