name: Kuantra Terminal Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: bash scripts/package_windows.sh
          - os: macos-latest
            package: bash scripts/package_macos.sh
          - os: ubuntu-22.04
            package: bash scripts/package_linux.sh
    steps:
      - uses: actions/checkout@v7
      - name: Initialize isolated data directory
        shell: bash
        run: printf '%s\n' 'KUANTRA_DATA_DIR=${{ runner.temp }}/kuantra-data' >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils xvfb libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libnss3 libasound2 libgl1 libegl1 \
            libxdamage1 libxcomposite1 libxrandr2 libxtst6 libdbus-1-3
      - name: Install NSIS (windows-2025 images ship without it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Verify release truth contract
        shell: bash
        run: python scripts/check_release_truth.py --tag "${GITHUB_REF_NAME}"
      - name: Run full backend test suite
        run: python -m pytest backend/tests -q --tb=short
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=moderate
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build desktop app
        run: python scripts/build_desktop.py --skip-frontend
      - name: Smoke test desktop app
        shell: bash
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python scripts/smoke_desktop.py; else python scripts/smoke_desktop.py; fi
      - name: Package
        shell: bash
        run: ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: dist/Kuantra-Terminal-*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify release truth contract
        run: python scripts/check_release_truth.py --tag "${GITHUB_REF_NAME}"
      - name: Render current release notes
        run: python scripts/render_current_release_notes.py --output dist/CURRENT_RELEASE_NOTES.md
      - name: Build MANIFEST.json
        run: python scripts/generate_release_manifest.py --dist dist --tag "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kuantra Terminal ${{ github.ref_name }}
          body_path: dist/CURRENT_RELEASE_NOTES.md
          files: |
            dist/Kuantra-Terminal-*
            dist/MANIFEST.json
