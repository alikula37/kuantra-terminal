name: Prune Duplicate Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to clean (e.g. v1.3.0-production)"
        required: true
        default: "v1.3.0-production"

permissions:
  contents: write

jobs:
  prune-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Redundant & Duplicated Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "Fetching assets for release: $TAG"

          # Get all asset IDs and names
          ASSETS=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[] | "\(.id) \(.name)"')

          echo "Current assets:"
          echo "$ASSETS"

          # Delete unwanted patterns: .sha256 files, CHECKSUMS.md, dot-notation duplicates
          while IFS= read -r line; do
            ID=$(echo "$line" | awk '{print $1}')
            NAME=$(echo "$line" | awk '{$1=""; print substr($0,2)}')

            if echo "$NAME" | grep -qE '\.sha256$|^CHECKSUMS\.md$|^Kuantra\.Terminal_'; then
              echo "Deleting: $NAME (ID: $ID)"
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$ID" || true
            fi
          done <<< "$ASSETS"

          echo ""
          echo "Remaining assets after cleanup:"
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[] | "\(.name) (\(.size) bytes)"'
