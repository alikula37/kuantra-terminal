name: Kuantra Terminal CI

on:
  push:
    branches: [ main, 'codex/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-22.04 ]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize isolated data directory
        shell: bash
        run: printf '%s\n' 'KUANTRA_DATA_DIR=${{ runner.temp }}/kuantra-data' >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils xvfb libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libnss3 libasound2 libgl1 libegl1 \
            libxdamage1 libxcomposite1 libxrandr2 libxtst6 libdbus-1-3 wl-clipboard xclip
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Verify release truth contract
        run: python scripts/check_release_truth.py
      - name: Run full backend test suite
        run: python -m pytest backend/tests -q --tb=short
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=moderate
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build desktop app
        run: python scripts/build_desktop.py --skip-frontend
      - name: Smoke test desktop app
        shell: bash
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python scripts/smoke_desktop.py; else python scripts/smoke_desktop.py; fi
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.os }}
          path: dist/smoke.json
          if-no-files-found: ignore
