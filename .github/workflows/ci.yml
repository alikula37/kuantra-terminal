name: Kuantra Terminal Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies (WebKit & AppIndicator)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cryptography alembic pytest pytest-asyncio anyio psutil httpx pyyaml pyinstaller

      - name: Execute Comprehensive Pytest Suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest backend/tests -v --tb=short 2>&1 | tee pytest_log.txt || {
            echo "### ❌ Pytest Failure Output (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 pytest_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Pytest Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.os }}
          path: pytest_log.txt

      - name: Verify Frontend Production Build & TypeScript Types
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build macOS Lite Sidecar & Tauri DMG Bundle
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== COMPILING MACOS LITE CORE SIDECAR ==="
          mkdir -p src-tauri/binaries
          python -m PyInstaller \
            --onefile \
            --clean \
            --name "kuantra-backend-aarch64-apple-darwin" \
            --distpath "src-tauri/binaries" \
            --workpath "backend/build" \
            --specpath "backend" \
            --exclude-module duckdb \
            --exclude-module pandas \
            --exclude-module numpy \
            --exclude-module scipy \
            --exclude-module torch \
            --exclude-module bleak \
            --exclude-module web3 \
            --exclude-module quickfix \
            --exclude-module PIL \
            --exclude-module matplotlib \
            --exclude-module tkinter \
            --exclude-module pytest \
            --exclude-module unittest \
            --exclude-module doctest \
            --exclude-module test \
            --exclude-module alembic.testing \
            --exclude-module setuptools \
            --exclude-module pkg_resources \
            --collect-submodules app \
            --collect-submodules starlette \
            --collect-submodules fastapi \
            --collect-submodules uvicorn \
            --collect-submodules pydantic \
            --collect-submodules cryptography \
            backend/main.py
          
          chmod +x src-tauri/binaries/kuantra-backend-aarch64-apple-darwin
          echo "Sidecar binary size: $(stat -f%z src-tauri/binaries/kuantra-backend-aarch64-apple-darwin) bytes"

          echo "=== BUILDING NATIVE MACOS DMG BUNDLE ==="
          npm install
          npx tauri build --bundles dmg

          echo "=== PACKAGING & MANIFEST GENERATION ==="
          mkdir -p dist-binaries
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          echo "Generated DMG at: $DMG_PATH"
          ls -lh "$DMG_PATH"

          cp "$DMG_PATH" dist-binaries/Kuantra-Terminal-1.2.0-aarch64.dmg
          DMG_SIZE=$(stat -f%z "dist-binaries/Kuantra-Terminal-1.2.0-aarch64.dmg")
          echo "Real DMG Size: $DMG_SIZE bytes"

          if [ "$DMG_SIZE" -gt 36700160 ]; then
            echo "ERROR: DMG size exceeds 35MB limit!"
            exit 1
          fi

          python scripts/generate_release_manifest.py

          echo "=== PUBLISHING GENUINE DMG TO GITHUB RELEASE ==="
          gh release upload v1.2.0-modular dist-binaries/Kuantra-Terminal-1.2.0-aarch64.dmg dist-binaries/MANIFEST.json --clobber
          echo "[+] Successfully published Kuantra-Terminal-1.2.0-aarch64.dmg to GitHub Release v1.2.0-modular"