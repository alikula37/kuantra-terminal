<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 12px;
      font-family: monospace;
      background-color: #0b0e14;
      color: #f1f5f9;
      font-size: 11px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .title {
      font-weight: bold;
      color: #38bdf8;
    }
    .status-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 9px;
    }
    .online { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.4); }
    .offline { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .val {
      font-weight: bold;
      color: #ffffff;
    }
    .port-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .port-row input {
      width: 72px;
      background: #111722;
      border: 1px solid #1e293b;
      border-radius: 4px;
      color: #ffffff;
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 5px;
      text-align: right;
    }
    .port-row button {
      background: #0f2136;
      border: 1px solid #38bdf8;
      border-radius: 4px;
      color: #38bdf8;
      cursor: pointer;
      font-family: monospace;
      font-size: 9px;
      font-weight: bold;
      padding: 4px 8px;
    }
    .port-row button:hover { background: #14314f; }
    .hint {
      color: #64748b;
      font-size: 9px;
      margin: -2px 0 8px 0;
    }
    .hint.saved { color: #22c55e; }
    .footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
      text-align: center;
      font-size: 9px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">KUANTRA TV SYNC</span>
    <span id="status-badge" class="status-badge offline">CONNECTING</span>
  </div>
  <div class="row">
    <span>Active Symbol:</span>
    <span id="active-symbol" class="val">BTCUSDT</span>
  </div>
  <div class="row">
    <span>Timeframe:</span>
    <span id="active-interval" class="val">15m</span>
  </div>
  <div class="port-row">
    <span>Bridge Port:</span>
    <span>
      <input id="port" type="number" min="1024" max="65535" step="1" value="8765">
      <button id="save-port" type="button">SAVE</button>
    </span>
  </div>
  <div id="port-hint" class="hint">Desktop app integrations gateway (default 8765).</div>
  <div class="row">
    <span>Latency:</span>
    <span class="val" style="color: #22c55e;">&lt; 5 ms</span>
  </div>
  <div class="footer">
    Kuantra Terminal v1.3.0 Sync Bridge
  </div>
  <script src="popup.js"></script>
</body>
</html>
